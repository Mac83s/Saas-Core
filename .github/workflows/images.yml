name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Backend and frontend carry a deployment profile, so there is one image
      # per product rather than one image pretending to serve both. Which
      # profiles this repository publishes is its own `product.json` (ADR-049):
      # Saas-Core builds business and core-only, a product repository builds
      # its product, and neither edits this file to say so.
      - name: Obrazy z product.json
        id: matrix
        run: |
          node -e '
            const { profiles } = require("./product.json");
            const include = profiles.flatMap((profile) => [
              { name: "backend", dockerfile: "apps/backend/Dockerfile", profile },
              { name: "frontend", dockerfile: "apps/frontend/Dockerfile", profile },
            ]);
            include.push(
              { name: "caddy", dockerfile: "infra/caddy/Dockerfile", profile: "" },
              { name: "redis", dockerfile: "infra/redis/Dockerfile", profile: "" },
            );
            console.log(`matrix=${JSON.stringify({ include })}`);
          ' >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Ustal nazwę i tag obrazu
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}"
          tag="${image_name}:sha-${{ github.event.workflow_run.head_sha }}"
          profile="${{ matrix.profile }}"
          # The profile belongs in the tag: two images from one commit are two
          # products, and a deployment has to be able to name which one it runs.
          if [ -n "${profile}" ]; then
            tag="${tag}-${profile}"
            echo "build_args=DEPLOYMENT=${profile}" >> "${GITHUB_OUTPUT}"
          else
            echo "build_args=" >> "${GITHUB_OUTPUT}"
          fi
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "scope=${{ matrix.name }}${profile:+-${profile}}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Zbuduj i opublikuj
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ steps.image.outputs.build_args }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.image.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.scope }}

      - name: Skan podatności obrazu
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: GitHub attestation dla repozytorium publicznego
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Podsumowanie digestu
        run: |
          echo '### ${{ matrix.name }} ${{ matrix.profile }}' >> "${GITHUB_STEP_SUMMARY}"
          echo '${{ steps.image.outputs.tag }}' >> "${GITHUB_STEP_SUMMARY}"
          echo '${{ steps.build.outputs.digest }}' >> "${GITHUB_STEP_SUMMARY}"
