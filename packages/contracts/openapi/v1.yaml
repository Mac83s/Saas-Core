    AnimalHealthCorrectionInput:
      type: object
      description: |-
        A hand-written entry corrected or withdrawn by its author (ADR-062).

        `reason` is required unless the entry is the keeper's private note.
      properties:
        action:
          $ref: '#/components/schemas/AnimalHealthCorrectionInputActionEnum'
        reason:
          type: string
          default: ''
          maxLength: 240
        kind:
          $ref: '#/components/schemas/KindA87Enum'
        occurred_on:
          type: string
          format: date
        summary:
          type: string
          default: ''
          maxLength: 240
      required:
      - action
    AnimalHealthCorrectionInputActionEnum:
      enum:
      - replace
      - withdraw
      type: string
      description: |-
        * `replace` - replace
        * `withdraw` - withdraw
    AnimalHealthEntry:
      type: object
      description: One entry of an animal's history, as the keeper reads it.
      properties:
        id:
          type: string
          format: uuid
        animal_id:
          type: string
          format: uuid
        kind:
          type: string
        occurred_on:
          type: string
          format: date
        source:
          type: string
        source_reference:
          type: string
        author_name:
          type: string
        author_organization_name:
          type: string
        author_is_external:
          type: boolean
          default: false
        private:
          type: boolean
        photos:
          type: array
          items:
            type: string
            format: uuid
        summary:
          type: string
        details:
          type: object
          additionalProperties: {}
        withdrawal_milk_until:
          type:
          - string
          - 'null'
          format: date-time
        withdrawal_meat_until:
          type:
          - string
          - 'null'
          format: date-time
        published_at:
          type: string
          format: date-time
        revision:
          type: integer
        corrects_id:
          type:
          - string
          - 'null'
          format: uuid
        correction_reason:
          type: string
        corrected_by:
          type: string
        retracted_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - animal_id
      - author_name
      - author_organization_name
      - corrected_by
      - correction_reason
      - corrects_id
      - details
      - id
      - kind
      - occurred_on
      - photos
      - private
      - published_at
      - retracted_at
      - revision
      - source
      - source_reference
      - summary
      - withdrawal_meat_until
      - withdrawal_milk_until
