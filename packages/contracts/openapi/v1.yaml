  /api/v1/sites/{site_id}/translations/:
    get:
      operationId: sites_translation_overview
      description: 'Pages: missing, pending, outdated, untranslated or complete per
        language, with the untranslated count. Articles: published, draft or missing
        per language. Filter by language and state; paginated by cursor.'
      summary: Every page or article of a site against every other language
      parameters:
      - in: query
        name: cursor
        schema:
          type:
          - string
          - 'null'
          format: uuid
      - in: query
        name: kind
        schema:
          enum:
          - page
          - entry
          type: string
          default: page
          minLength: 1
        description: |-
          * `page` - page
          * `entry` - entry
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
      - in: query
        name: locale
        schema:
          type: string
          pattern: ^[a-z]{2}$
          minLength: 1
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: state
        schema:
          enum:
          - missing
          - pending
          - outdated
          - untranslated
          - complete
          - published
          - draft
          type: string
          minLength: 1
        description: |-
          * `missing` - missing
          * `pending` - pending
          * `outdated` - outdated
          * `untranslated` - untranslated
          * `complete` - complete
          * `published` - published
          * `draft` - draft
      tags:
      - sites
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationOverview'
          description: ''
        '400':
          content:
            application/json:
