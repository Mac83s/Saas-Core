        origin:
          type:
          - string
          - 'null'
          description: 'Who wrote it: human, ai, integration, template, import, or
            copy (the source text standing in, still untranslated).'
        translated:
          type: boolean
        suggestion:
          type:
          - string
          - 'null'
          description: A person's text for this unit's earlier source wording, kept
            when the source changed; for review, never published as the translation.
