          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
      x-quality-exempt:
        idempotency-key: A code counts once, so a repeat is refused; a new code only
          moves the step-up time.
