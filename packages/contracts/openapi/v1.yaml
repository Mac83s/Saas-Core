            format: uuid
          maxItems: 100
        location_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        resource_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        materials:
          type: array
          items:
            $ref: '#/components/schemas/MaterialInput'
        expected_version:
          type: integer
          minimum: 1
          description: The version the change was made on, as the last read gave it;
