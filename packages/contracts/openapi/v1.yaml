components:
  schemas:
    ActionEnum:
      enum:
      - disable
      - enable
      - release
      - set_canonical
      - verify
      type: string
      description: |-
        * `disable` - disable
        * `enable` - enable
        * `release` - release
        * `set_canonical` - set_canonical
        * `verify` - verify
    ActiveOrganization:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
      required:
      - organization_id
    ActiveOrganizationResult:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
      required:
      - organization
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        secret:
          type: string
      required:
      - created_at
      - expires_at
      - id
      - name
      - prefix
      - revoked_at
      - scopes
    ApiKeyCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
            maxLength: 80
          minItems: 1
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - name
      - scopes
    ApiKeyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
      required:
      - items
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
        service_name:
          type: string
        status:
          type: string
        customer_name:
          type: string
        staff_name:
          type: string
        location_name:
          type: string
        resource_name:
          type:
          - string
          - 'null'
        self_service_token:
          type:
          - string
          - 'null'
      required:
      - customer_name
      - ends_at
      - id
      - location_name
      - resource_name
      - service_name
      - staff_name
      - starts_at
      - status
      - timezone
    AppointmentCreate:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
        starts_at:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/CustomerInput'
      required:
      - customer
      - location_id
      - service_id
      - staff_id
      - starts_at
    AppointmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
      required:
      - items
    AutomationConnection:
      type: object
      properties:
        grant_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        mode:
          type: string
        scope:
          type: object
          additionalProperties: {}
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        active:
          type: boolean
        max_changes_per_day:
