          allOf:
          - $ref: '#/components/schemas/LocaleBodyUnitKindEnum'
          description: |-
            `inline` carries its marks as tokens ⟦n⟧…⟦/n⟧ that must stay; `name` and `address` are copied into every language unless overridden.

            * `text` - text
