  /api/v1/auth/step-up/:
    post:
      operationId: identity_step_up_create
      description: A code from the authenticator app — never a password or a recovery
        code — marks the session as stepped up for STEP_UP_MAX_AGE seconds. Accepting
        legal documents and changing billing ask for it, in the panel and for the
        assistant (owner answers 30a, 31b). An account without two-factor sign-in
        gets 403 step_up_mfa_setup_required; five wrong codes end the session (403
        step_up_locked).
      summary: Confirm the second factor once more
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUp'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StepUp'
          multipart/form-data:
            schema:
