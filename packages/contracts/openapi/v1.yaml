          $ref: '#/components/schemas/DataClassEnum'
        placeholder:
          type: boolean
          description: 'The source holds an owner''s [Uzupełnij: …] slot; the language
            version waits until the owner fills the source.'
        max_length:
          type:
          - integer
          - 'null'
        required_text:
          type: boolean
          description: The unit may not be left empty.
      required:
      - data_class
