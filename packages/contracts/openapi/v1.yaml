  /api/v1/organizations/current/command-consents/{digest}/:
    get:
      operationId: organizations_command_consent_retrieve
      description: 'The assistant''s plan for one consent group exactly as the server
        previewed it: titles, typed effects, quote, risk class and whether a step-up
        is due. The consent dialog renders this and nothing else (ADR-076 §3). Another
        membership''s plan and an expired one both answer 404 consent_preview_not_found.'
      summary: Show a plan waiting for consent
      parameters:
      - in: path
        name: digest
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandConsent'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
    post:
      operationId: organizations_command_consent_create
      description: Mints the consent token for one plan group the person has just
        seen. The token binds the membership, the assistant's conversation and the
        plan's digest, and expires after COMMAND_CONSENT_TTL seconds; the executor
        checks it against a fresh preview. A group that needs a step-up (legal documents,
        billing) takes the session's fresh step-up into the token, and answers 403
        step_up_required without one — or step_up_mfa_setup_required for an account
        without two-factor sign-in.
      summary: Consent to a plan
      parameters:
      - in: path
        name: digest
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandConsentGrant'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: ''
      x-quality-exempt:
        idempotency-key: 'Mints a stateless signature: repeating the call gives an
          equivalent token for the same plan and changes nothing else.'
