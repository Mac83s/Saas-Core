components:
  schemas:
    ActionEnum:
      enum:
      - disable
      - enable
      - release
      - set_canonical
      - verify
      type: string
      description: |-
        * `disable` - disable
        * `enable` - enable
        * `release` - release
        * `set_canonical` - set_canonical
        * `verify` - verify
    ActiveOrganization:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
      required:
      - organization_id
    ActiveOrganizationResult:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
      required:
      - organization
    Animal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        farm_id:
          type: string
          format: uuid
          readOnly: true
        farm_name:
          type: string
          readOnly: true
        species:
          type: string
          readOnly: true
        national_id:
          type: string
          readOnly: true
        working_number:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        sex:
          type: string
          readOnly: true
        birth_date:
          type:
          - string
          - 'null'
          format: date
          readOnly: true
        status:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        review_requested_at:
          type:
          - string
