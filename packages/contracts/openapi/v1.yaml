    ServiceUpdate:
      type: object
      description: 'A change to a service: only the fields sent change.'
      properties:
        name:
          type: string
          maxLength: 160
        duration_minutes:
          type: integer
          maximum: 1440
          minimum: 5
          description: How long one visit of this service takes, in minutes.
        buffer_before_minutes:
          type: integer
          maximum: 1440
          minimum: 0
          description: Minutes blocked in the calendar before each visit (travel,
            preparation); customers do not see them.
        buffer_after_minutes:
          type: integer
          maximum: 1440
          minimum: 0
          description: Minutes blocked in the calendar after each visit (tidying up,
            travel); customers do not see them.
        minimum_notice_minutes:
          type: integer
          maximum: 129600
          minimum: 0
          description: How many minutes before its start a visit can still be booked;
            0 allows booking up to the start.
        staff_count:
          type: integer
          maximum: 10
          minimum: 1
          description: How many of the company's people one visit needs; each is blocked.
        public_staff_choice:
          $ref: '#/components/schemas/PublicStaffChoiceEnum'
