components:
  schemas:
    ActiveOrganization:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
      required:
      - organization_id
    ActiveOrganizationResult:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
      required:
      - organization
    BillingSession:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - url
    CheckoutCreate:
      type: object
      properties:
        plan:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - plan
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DraftSave:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PageBlockInput'
      required:
      - blocks
      - expected_version
    EntitlementSupportItem:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        key:
          type: string
        available:
          type: boolean
        reason:
          type: string
        read_allowed:
          type:
          - boolean
          - 'null'
        read_reason:
          type:
          - string
          - 'null'
        value:
          type:
          - integer
          - 'null'
        used:
          type:
          - integer
          - 'null'
        reserved:
          type:
          - integer
          - 'null'
        period_start:
          type:
          - string
          - 'null'
          format: date
        period_end:
          type:
          - string
          - 'null'
          format: date
        evidence:
          oneOf:
          - {}
          - type: 'null'
      required:
      - available
      - evidence
      - key
      - kind
      - period_end
      - period_start
      - read_allowed
      - read_reason
      - reason
      - reserved
      - used
      - value
    EntitlementSupportReport:
      type: object
      properties:
        snapshot:
          oneOf:
          - $ref: '#/components/schemas/EntitlementSupportSnapshot'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementSupportItem'
      required:
      - items
      - snapshot
    EntitlementSupportSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        subscription_state:
          type: string
        access_mode:
          type: string
        plan_key:
          type:
          - string
          - 'null'
        plan_version:
          type:
          - integer
          - 'null'
        computed_at:
          type: string
          format: date-time
        effective_until:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - access_mode
      - computed_at
      - effective_until
      - id
      - plan_key
      - plan_version
      - subscription_state
      - version
    GenericMessage:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        deployment:
          type: string
        version:
          type: string
        correlation_id:
          type: string
          format: uuid
        checks:
          type: object
          additionalProperties:
            type: string
      required:
      - checks
      - correlation_id
      - deployment
      - status
      - version
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    InvitationAccept:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 160
          minLength: 64
      required:
      - token
    InvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - email
      - role
    InvitationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - email
      - expires_at
      - id
      - role
      - status
    KindEnum:
      enum:
      - feature
      - quota
      type: string
      description: |-
        * `feature` - feature
        * `quota` - quota
    LifecycleResult:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LocaleEnum:
      enum:
      - pl
      - en
      type: string
      description: |-
        * `pl` - pl
        * `en` - en
    LocaleLocalization:
      type: object
      properties:
        locale:
          type: string
        translation_id:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type:
          - integer
          - 'null'
        slug:
          type:
          - string
          - 'null'
        path:
          type:
          - string
          - 'null'
        canonical_path:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        social_title:
          type:
          - string
          - 'null'
        social_description:
          type:
          - string
          - 'null'
        fallback_fields:
          type: array
          items:
            type: string
        missing_fields:
          type: array
          items:
            type: string
        complete:
          type: boolean
        slug_locked:
          type: boolean
      required:
      - canonical_path
      - complete
      - description
      - fallback_fields
      - locale
      - missing_fields
      - path
      - slug
      - slug_locked
      - social_description
      - social_title
      - title
      - translation_id
      - version
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    MembershipSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        joined_at:
          type: string
          format: date-time
      required:
      - email
      - id
      - joined_at
      - role
      - status
      - user_id
    MembershipUpdateStatusEnum:
      enum:
      - active
      - suspended
      - revoked
      type: string
      description: |-
        * `active` - active
        * `suspended` - suspended
        * `revoked` - revoked
    MfaChallenge:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MfaChallengeStatusEnum'
      required:
      - status
    MfaChallengeStatusEnum:
      enum:
      - mfa_required
      type: string
      description: '* `mfa_required` - mfa_required'
    MfaCode:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          maxLength: 32
          minLength: 6
      required:
      - code
    OrganizationArchived:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OrganizationArchivedStatusEnum'
      required:
      - status
    OrganizationArchivedStatusEnum:
      enum:
      - archived
      type: string
      description: '* `archived` - archived'
    OrganizationCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
