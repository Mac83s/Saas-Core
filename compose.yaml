name: saas-core

x-backend-environment: &backend-environment
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  APP_ENV: local
  CSRF_TRUSTED_ORIGINS: http://localhost:8080
  DEPLOYMENT: ${DEPLOYMENT:-core-only}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  DJANGO_SETTINGS_MODULE: saas_core.config.settings.container
  EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
  EMAIL_FILE_PATH: /var/lib/saas-core/emails
  FRONTEND_BASE_URL: http://localhost:${SAAS_CORE_HTTP_PORT:-8080}
  LOG_DIRECTORY: /var/log/saas-core
  ORGANIZATION_INVITATION_TTL_SECONDS: ${ORGANIZATION_INVITATION_TTL_SECONDS:-604800}
  POSTGRES_DB: ${SAAS_CORE_POSTGRES_DB:-saas_core}
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_PORT: "5432"
  POSTGRES_USER: saas_core
  REDIS_HOST: redis
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-saas_core_local_session}
  SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  SESSION_MAX_LIFETIME_SECONDS: ${SESSION_MAX_LIFETIME_SECONDS:-86400}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2026-07-29.dahlia}
  STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}
  STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
  STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
  STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
  TENANT_TASK_CONTEXT_TTL_SECONDS: ${TENANT_TASK_CONTEXT_TTL_SECONDS:-86400}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

x-backend-service: &backend-service
  image: saas-core-backend:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  environment: *backend-environment
  secrets:
    - django_secret_key
    - postgres_password
    - stripe_secret_key
    - stripe_webhook_secret
  volumes:
    - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core
  networks:
    - app
    - data
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${SAAS_CORE_POSTGRES_DB:-saas_core}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: saas_core
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${SAAS_CORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data
      - host-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_core -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: saas-core-redis:local
    build:
      context: .
      dockerfile: infra/redis/Dockerfile
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SAAS_CORE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - data
      - host-access
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      <<: *backend-environment
      LOG_SERVICE: migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: backend
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    networks:
      - app
      - data
      - monitoring
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  worker:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: worker
    command:
      [
        "celery",
        "-A",
        "saas_core.config.celery",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--hostname=worker@%h",
        "--max-tasks-per-child=500",
      ]
    volumes:
      - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core
      - ${SAAS_CORE_EMAILS_DIR:-.runtime/emails}:/var/lib/saas-core/emails
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A saas_core.config.celery inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep --quiet pong",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  scheduler:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: scheduler
    command:
      [
        "celery",
        "-A",
        "saas_core.config.celery",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  frontend:
    image: saas-core-frontend:local
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        DEPLOYMENT: ${DEPLOYMENT:-core-only}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    networks:
      - app
    read_only: true
    tmpfs:
      - /app/apps/frontend/.next/cache:size=64m,mode=1777
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  caddy:
    image: saas-core-caddy:local
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "127.0.0.1:${SAAS_CORE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - app
      - monitoring
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health/live/",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  celery-exporter:
    <<: *backend-service
    command: ["python", "-m", "saas_core.observability.celery_exporter"]
    environment:
      <<: *backend-environment
      LOG_SERVICE: celery-exporter
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - data
      - monitoring
    expose:
      - "9808"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9808/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
      DATA_SOURCE_URI: postgres:5432/${SAAS_CORE_POSTGRES_DB:-saas_core}?sslmode=disable
      DATA_SOURCE_USER: saas_core
    secrets:
      - postgres_password
    networks:
      - data
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  redis-exporter:
    image: saas-core-redis:local
    command: ["redis_exporter"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_LOG_FORMAT: json
    networks:
      - data
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
      celery-exporter:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:${SAAS_CORE_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - edge
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

secrets:
  django_secret_key:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/django_secret_key
  postgres_password:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/postgres_password
  grafana_admin_password:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/grafana_admin_password
  stripe_secret_key:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/stripe_secret_key
  stripe_webhook_secret:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/stripe_webhook_secret

networks:
  edge:
  host-access:
  app:
    internal: true
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
