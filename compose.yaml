name: saas-core

x-backend-environment: &backend-environment
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  APP_ENV: local
  BILLING_PROVIDER: ${BILLING_PROVIDER:-simulated}
  CSRF_TRUSTED_ORIGINS: http://localhost:8080
  DEPLOYMENT: ${DEPLOYMENT:-core-only}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  DJANGO_SETTINGS_MODULE: saas_core.config.settings.container
  EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
  EMAIL_FILE_PATH: /var/lib/saas-core/emails
  FRONTEND_BASE_URL: http://localhost:${SAAS_CORE_HTTP_PORT:-8080}
  LOG_DIRECTORY: /var/log/saas-core
  ORGANIZATION_INVITATION_TTL_SECONDS: ${ORGANIZATION_INVITATION_TTL_SECONDS:-604800}
  OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key_id
  OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_access_key
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-core-local}
  OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:8333
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:${SAAS_CORE_S3_PORT:-8333}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  POSTGRES_DB: ${SAAS_CORE_POSTGRES_DB:-saas_core}
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${SAAS_CORE_POSTGRES_APP_USER:-saas_core_app}
  REDIS_HOST: redis
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-saas_core_local_session}
  STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
  STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
  STRIPE_PORTAL_CONFIGURATION_ID: ${STRIPE_PORTAL_CONFIGURATION_ID:-}
  STRIPE_LIVEMODE: ${STRIPE_LIVEMODE:-false}
  SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  SESSION_MAX_LIFETIME_SECONDS: ${SESSION_MAX_LIFETIME_SECONDS:-86400}
  BILLING_LIFECYCLE_WARNING_LEAD_SECONDS: ${BILLING_LIFECYCLE_WARNING_LEAD_SECONDS:-86400}
  BILLING_LIFECYCLE_MAX_ATTEMPTS: ${BILLING_LIFECYCLE_MAX_ATTEMPTS:-5}
  BILLING_RECONCILIATION_INTERVAL_SECONDS: ${BILLING_RECONCILIATION_INTERVAL_SECONDS:-3600}
  BILLING_RECONCILIATION_MAX_ATTEMPTS: ${BILLING_RECONCILIATION_MAX_ATTEMPTS:-5}
  BILLING_RECONCILIATION_BATCH_SIZE: ${BILLING_RECONCILIATION_BATCH_SIZE:-100}
  BILLING_INVOICE_ADAPTER: ${BILLING_INVOICE_ADAPTER:-saas_core.modules.shared.billing.invoicing.InternalInvoiceAdapter}
  TENANT_TASK_CONTEXT_TTL_SECONDS: ${TENANT_TASK_CONTEXT_TTL_SECONDS:-3888000}
  NOTIFICATIONS_RETENTION_DAYS: ${NOTIFICATIONS_RETENTION_DAYS:-30}
  NOTIFICATIONS_EXPORT_TTL_HOURS: ${NOTIFICATIONS_EXPORT_TTL_HOURS:-24}
  NOTIFICATIONS_EXPORT_MAX_ROWS: ${NOTIFICATIONS_EXPORT_MAX_ROWS:-10000}
  NOTIFICATIONS_WEBHOOK_TOLERANCE_SECONDS: ${NOTIFICATIONS_WEBHOOK_TOLERANCE_SECONDS:-300}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
  MEDIA_MAX_IMAGE_PIXELS: ${MEDIA_MAX_IMAGE_PIXELS:-40000000}
  MEDIA_PROCESSING_RESERVATION_TTL_SECONDS: ${MEDIA_PROCESSING_RESERVATION_TTL_SECONDS:-3600}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

x-backend-service: &backend-service
  image: saas-core-backend:local
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
    args:
      DEPLOYMENT: ${DEPLOYMENT:-core-only}
  environment: *backend-environment
  secrets:
    - django_secret_key
    - postgres_app_password
    - object_storage_access_key_id
    - object_storage_secret_access_key
    - stripe_secret_key
    - stripe_webhook_secret
  volumes:
    - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core
  networks:
    - app
    - data
    - egress
    - scanner
    - storage
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${SAAS_CORE_POSTGRES_DB:-saas_core}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${SAAS_CORE_POSTGRES_MIGRATION_USER:-saas_core}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${SAAS_CORE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data
      - host-access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  database-bootstrap:
    image: postgres:18-alpine
    entrypoint: ["/usr/local/bin/bootstrap-app-role.sh"]
    environment:
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      POSTGRES_APP_USER: ${SAAS_CORE_POSTGRES_APP_USER:-saas_core_app}
      POSTGRES_DB: ${SAAS_CORE_POSTGRES_DB:-saas_core}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${SAAS_CORE_POSTGRES_MIGRATION_USER:-saas_core}
    secrets:
      - postgres_app_password
      - postgres_password
    volumes:
      - ./infra/postgres/bootstrap-app-role.sh:/usr/local/bin/bootstrap-app-role.sh:ro
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  redis:
    image: saas-core-redis:local
    build:
      context: .
      dockerfile: infra/redis/Dockerfile
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${SAAS_CORE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - data
      - host-access
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  object-storage:
    image: saas-core-object-storage:local
    build:
      context: .
      dockerfile: infra/object-storage/Dockerfile
    environment:
      OBJECT_STORAGE_ACCESS_KEY_ID_FILE: /run/secrets/object_storage_access_key_id
      OBJECT_STORAGE_SECRET_ACCESS_KEY_FILE: /run/secrets/object_storage_secret_access_key
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-saas-core-local}
      OBJECT_STORAGE_ALLOWED_ORIGINS: http://localhost:${SAAS_CORE_HTTP_PORT:-8080},http://127.0.0.1:${SAAS_CORE_HTTP_PORT:-8080}
    secrets:
      - object_storage_access_key_id
      - object_storage_secret_access_key
    ports:
      - "127.0.0.1:${SAAS_CORE_S3_PORT:-8333}:8333"
    volumes:
      - object-storage-data:/data
    networks:
      - storage
      - host-access
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    environment:
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_MaxFileSize: 12M
      CLAMD_CONF_MaxScanSize: 12M
      CLAMD_CONF_StreamMaxLength: 12M
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - scanner
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  migrate:
    <<: *backend-service
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py configure_simulated_prices
    environment:
      <<: *backend-environment
      LOG_SERVICE: migrate
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${SAAS_CORE_POSTGRES_MIGRATION_USER:-saas_core}
    secrets:
      # Overriding the list means the anchor's entries do not apply, so the
      # Stripe files have to be repeated here — settings read them at import
      # time, migrate included.
      - django_secret_key
      - postgres_password
      - object_storage_access_key_id
      - object_storage_secret_access_key
      - stripe_secret_key
      - stripe_webhook_secret
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: backend
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    networks:
      - app
      - data
      - egress
      - monitoring
      - storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  worker:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: worker
    command:
      - sh
      - -c
      - >-
        python manage.py check_database_role &&
        python manage.py check_malware_scanner &&
        exec celery -A saas_core.config.celery worker --loglevel=INFO
        --concurrency=2 --hostname=worker@%h --max-tasks-per-child=500
    volumes:
      - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core
      - ${SAAS_CORE_EMAILS_DIR:-.runtime/emails}:/var/lib/saas-core/emails
    depends_on:
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A saas_core.config.celery inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep --quiet pong",
        ]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  scheduler:
    <<: *backend-service
    environment:
      <<: *backend-environment
      LOG_SERVICE: scheduler
    command:
      - sh
      - -c
      - >-
        python manage.py check_database_role &&
        exec celery -A saas_core.config.celery beat --loglevel=INFO
        --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  frontend:
    image: saas-core-frontend:local
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        DEPLOYMENT: ${DEPLOYMENT:-core-only}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      FRONTEND_CONTROL_HOSTS: localhost,127.0.0.1
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    networks:
      - app
    read_only: true
    tmpfs:
      - /app/apps/frontend/.next/cache:size=64m,mode=1777
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  caddy:
    image: saas-core-caddy:local
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "127.0.0.1:${SAAS_CORE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - app
      - monitoring
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/api/v1/health/live/",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  celery-exporter:
    <<: *backend-service
    command:
      - sh
      - -c
      - >-
        python manage.py check_database_role &&
        exec python -m saas_core.observability.celery_exporter
    environment:
      <<: *backend-environment
      LOG_SERVICE: celery-exporter
    depends_on:
      worker:
        condition: service_healthy
    networks:
      - data
      - monitoring
    expose:
      - "9808"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9808/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
      DATA_SOURCE_URI: postgres:5432/${SAAS_CORE_POSTGRES_DB:-saas_core}?sslmode=disable
      DATA_SOURCE_USER: ${SAAS_CORE_POSTGRES_MIGRATION_USER:-saas_core}
    secrets:
      - postgres_password
    networks:
      - data
      - monitoring
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  redis-exporter:
    image: saas-core-redis:local
    command: ["redis_exporter"]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_LOG_FORMAT: json
    networks:
      - data
      - monitoring
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
      celery-exporter:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${SAAS_CORE_LOGS_DIR:-.runtime/logs}:/var/log/saas-core:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:${SAAS_CORE_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - edge
      - monitoring
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

secrets:
  django_secret_key:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/django_secret_key
  postgres_password:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/postgres_password
  postgres_app_password:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/postgres_app_password
  grafana_admin_password:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/grafana_admin_password
  object_storage_access_key_id:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/object_storage_access_key_id
  object_storage_secret_access_key:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/object_storage_secret_access_key
  # Present even on the simulator: the file is read only when
  # BILLING_PROVIDER=stripe, and a missing mount would turn "switch the
  # provider" into "rebuild the compose file" at the worst moment.
  stripe_secret_key:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/stripe_secret_key
  stripe_webhook_secret:
    file: ${SAAS_CORE_SECRETS_DIR:-.runtime/secrets}/stripe_webhook_secret

networks:
  edge:
  egress:
  host-access:
  app:
    internal: true
  data:
    internal: true
  scanner:
    internal: true
  monitoring:
    internal: true
  storage:
    internal: true

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
  object-storage-data:
  clamav-data:
