x-staging-backend-environment: &staging-backend-environment
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS jest wymagany}
  APP_ENV: staging
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS jest wymagany}
  DEPLOYMENT: ${DEPLOYMENT:?DEPLOYMENT jest wymagany}
  DJANGO_SETTINGS_MODULE: saas_core.config.settings.container
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ORGANIZATION_INVITATION_TTL_SECONDS: ${ORGANIZATION_INVITATION_TTL_SECONDS:-604800}
  REDIS_HOST: redis
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  TENANT_TASK_CONTEXT_TTL_SECONDS: ${TENANT_TASK_CONTEXT_TTL_SECONDS:-86400}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-30}
  MEDIA_MAX_IMAGE_PIXELS: ${MEDIA_MAX_IMAGE_PIXELS:-40000000}
  MEDIA_PROCESSING_RESERVATION_TTL_SECONDS: ${MEDIA_PROCESSING_RESERVATION_TTL_SECONDS:-3600}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET jest wymagany}
  OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:?OBJECT_STORAGE_ENDPOINT_URL jest wymagany}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
  OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: ${OBJECT_STORAGE_PUBLIC_ENDPOINT_URL:?OBJECT_STORAGE_PUBLIC_ENDPOINT_URL jest wymagany}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-eu-central-1}

services:
  object-storage:
    profiles:
      - local-only

  postgres:
    ports: !reset []
    networks: !override
      - data

  redis:
    image: ${SAAS_CORE_REDIS_IMAGE:-${SAAS_CORE_IMAGE_PREFIX:?SAAS_CORE_IMAGE_PREFIX jest wymagany}/redis:${SAAS_CORE_IMAGE_TAG:?SAAS_CORE_IMAGE_TAG jest wymagany}}
    build: !reset null
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    ports: !reset []
    networks: !override
      - data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep --quiet PONG",
        ]

  migrate:
    image: ${SAAS_CORE_BACKEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/backend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      <<: *staging-backend-environment
    secrets:
      - redis_password

  backend:
    image: ${SAAS_CORE_BACKEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/backend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      <<: *staging-backend-environment
    secrets:
      - redis_password

  worker:
    image: ${SAAS_CORE_BACKEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/backend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      <<: *staging-backend-environment
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL jest wymagany}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST jest wymagany}
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_host_password
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?EMAIL_HOST_USER jest wymagany}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL jest wymagany}
    secrets:
      - email_host_password
      - redis_password
    volumes: !override
      - ${SAAS_CORE_LOGS_DIR:-/opt/saas-core/logs}:/var/log/saas-core

  scheduler:
    image: ${SAAS_CORE_BACKEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/backend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      <<: *staging-backend-environment
    secrets:
      - redis_password

  celery-exporter:
    image: ${SAAS_CORE_BACKEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/backend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      <<: *staging-backend-environment
      LOG_SERVICE: celery-exporter
    secrets:
      - redis_password

  redis-exporter:
    image: ${SAAS_CORE_REDIS_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/redis:${SAAS_CORE_IMAGE_TAG}}
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password

  frontend:
    image: ${SAAS_CORE_FRONTEND_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/frontend:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null

  caddy:
    image: ${SAAS_CORE_CADDY_IMAGE:-${SAAS_CORE_IMAGE_PREFIX}/caddy:${SAAS_CORE_IMAGE_TAG}}
    build: !reset null
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL jest wymagany}
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST jest wymagany}
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes: !override
      - ./infra/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  email_host_password:
    file: ${SAAS_CORE_SECRETS_DIR:?SAAS_CORE_SECRETS_DIR jest wymagany}/email_host_password
  redis_password:
    file: ${SAAS_CORE_SECRETS_DIR:?SAAS_CORE_SECRETS_DIR jest wymagany}/redis_password
