global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: django
    metrics_path: /internal/metrics/
    static_configs:
      - targets: [backend:8000]

  - job_name: celery
    static_configs:
      - targets: [celery-exporter:9808]

  - job_name: caddy
    static_configs:
      - targets: [caddy:2019]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
