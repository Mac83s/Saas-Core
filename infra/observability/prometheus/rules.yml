groups:
  - name: saas-core
    rules:
      - alert: SaasCoreTargetDown
        expr: up{job=~"django|celery|caddy|postgres|redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} jest niedostępny"

      - alert: SaasCoreCeleryWorkerMissing
        expr: saas_core_celery_workers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Brak odpowiadającego workera Celery"

      - alert: SaasCoreHttpErrorRate
        expr: >-
          sum(rate(saas_core_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(saas_core_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Odsetek błędów HTTP przekracza 5%"

      - alert: SaasCoreNotificationBacklog
        expr: sum(saas_core_notification_pending_tasks{kind=~"email|webhook"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Narasta backlog dostaw powiadomień"

      - alert: SaasCoreNotificationDeadLetter
        expr: increase(saas_core_notification_delivery_results_total{outcome="dead_letter"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nowa dostawa trafiła do dead-letter"

      - alert: SaasCoreIntegrationSignatureFailures
        expr: increase(saas_core_integration_signature_failures_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Wzrost błędów podpisu webhooków integracyjnych"
